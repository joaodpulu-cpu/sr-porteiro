<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sr. Porteiro</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f4f7;
      color: #222;
    }

    .topo {
      background: #111827;
      color: white;
      padding: 25px 20px;
      text-align: center;
    }

    .topo h1 {
      margin: 0;
      font-size: 30px;
    }

    .topo p {
      margin: 8px 0 0;
      opacity: 0.8;
    }

    .conteudo {
      padding: 20px;
      max-width: 500px;
      margin: auto;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 15px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    }

    .card h2 {
      margin-top: 0;
    }

    .status {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .bolinha {
      width: 14px;
      height: 14px;
      background: #22c55e;
      border-radius: 50%;
      display: inline-block;
      margin-right: 8px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #111827;
      color: white;
      font-size: 16px;
      margin-top: 10px;
    }

    button:active {
      transform: scale(0.98);
    }

    .numero {
      background: #f3f4f6;
      padding: 12px;
      border-radius: 10px;
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <div class="topo">
    <h1>🚪 Sr. Porteiro</h1>
    <p>Seu celular, protegido contra chamadas indesejadas</p>
  </div>

  <div class="conteudo">

    <div class="card">
      <div class="status">
        <div>
          <h2>Proteção</h2>
          <span>
            <span class="bolinha"></span>
            Ativa
          </span>
        </div>
      </div>

      <p>
        O Sr. Porteiro permite chamadas apenas de números
        que você escolher.
      </p>

      <button onclick="ativarProtecao()">
        Ativar proteção
      </button>
    </div>

    <div class="card">
      <h2>📞 Chamadas bloqueadas</h2>

      <div class="numero">
        Nenhuma chamada bloqueada ainda.
      </div>
    </div>

    <div class="card">
      <h2>⚙️ Configurações</h2>

      <button onclick="alert('Em breve: números permitidos')">
        Números permitidos
      </button>

      <button onclick="alert('Em breve: histórico de chamadas')">
        Histórico de chamadas
      </button>
    </div>

  </div>

  <script>
    function ativarProtecao() {
      alert("🚪 Sr. Porteiro está ativando a proteção!");
    }
  </script>

</body>
  </html>
