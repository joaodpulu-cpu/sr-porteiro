<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sr. Porteiro</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f4f7;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      text-align: center;
      padding: 25px 15px;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    header p {
      margin: 8px 0 0;
      opacity: 0.8;
    }

    main {
      max-width: 500px;
      margin: auto;
      padding: 18px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .status {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .online {
      display: flex;
      align-items: center;
      gap: 7px;
      font-weight: bold;
    }

    .dot {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: #22c55e;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
      margin-top: 10px;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 14px;
      margin-top: 10px;
      background: #111827;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    button:active {
      transform: scale(0.98);
    }

    .numero {
      background: #f3f4f6;
      padding: 12px;
      border-radius: 10px;
      margin-top: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .remover {
      background: #dc2626;
      width: auto;
      padding: 8px 12px;
      margin: 0;
      font-size: 13px;
    }

    .vazio {
      color: #6b7280;
      margin-bottom: 0;
    }

    .bloqueio {
      text-align: center;
      padding: 15px;
      border-radius: 12px;
      background: #ecfdf5;
      color: #166534;
      font-weight: bold;
    }
  </style>
</head>

<body>

<header>
  <h1>🚪 Sr. Porteiro</h1>
  <p>Proteção contra chamadas indesejadas</p>
</header>

<main>

  <div class="card">
    <div class="status">
      <div>
        <h2>Proteção</h2>

        <div class="online">
          <span class="dot"></span>
          Ativa
        </div>
      </div>
    </div>

    <p>
      O Sr. Porteiro permite que você controle quais números
      poderão entrar em contato.
    </p>

    <div class="bloqueio">
      🛡️ Proteção ativada
    </div>
  </div>

  <div class="card">
    <h2>📞 Números autorizados</h2>

    <input
      type="tel"
      id="numero"
      placeholder="Digite o número"
    >

    <button onclick="adicionarNumero()">
      ➕ Autorizar número
    </button>

    <div id="lista">
      <p class="vazio">
        Nenhum número autorizado ainda.
      </p>
    </div>
  </div>

  <div class="card">
    <h2>🚫 Chamadas bloqueadas</h2>

    <p id="bloqueadas">
      Nenhuma chamada bloqueada.
    </p>
  </div>

</main>

<script>

  let numeros = JSON.parse(
    localStorage.getItem("numerosAutorizados")
  ) || [];

  function mostrarNumeros() {

    const lista = document.getElementById("lista");

    if (numeros.length === 0) {
      lista.innerHTML =
        '<p class="vazio">Nenhum número autorizado ainda.</p>';
      return;
    }

    lista.innerHTML = "";

    numeros.forEach(function(numero, indice) {

      const item = document.createElement("div");

      item.className = "numero";

      item.innerHTML = `
        <span>📱 ${numero}</span>
        <button class="remover"
          onclick="removerNumero(${indice})">
          Remover
        </button>
      `;

      lista.appendChild(item);

    });
  }

  function adicionarNumero() {

    const campo = document.getElementById("numero");

    const numero = campo.value.trim();

    if (numero === "") {
      alert("Digite um número.");
      return;
    }

    if (numeros.includes(numero)) {
      alert("Esse número já está autorizado.");
      return;
    }

    numeros.push(numero);

    localStorage.setItem(
      "numerosAutorizados",
      JSON.stringify(numeros)
    );

    campo.value = "";

    mostrarNumeros();

    alert("✅ Número autorizado!");
  }

  function removerNumero(indice) {

    numeros.splice(indice, 1);

    localStorage.setItem(
      "numerosAutorizados",
      JSON.stringify(numeros)
    );

    mostrarNumeros();
  }

  mostrarNumeros();

</script>

</body>
</html>
